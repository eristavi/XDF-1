<text x="795" y="247" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Programmable reflex</text>
<text x="795" y="272" fill="#a7bed1" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Neural adapter + state</text>
<path d="M925 223 L976 223" fill="none" stroke="#7892aa" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="979" y="126" width="255" height="213" rx="16" fill="#10253a" stroke="#ffd18a" stroke-width="2"/>
<text x="1106" y="168" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700">M3+</text>
