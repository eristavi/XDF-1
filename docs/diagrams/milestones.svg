<text x="484" y="168" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700">M2.2A</text>
<text x="484" y="205" fill="#7cb5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700">REFERENCE MODEL</text>
<text x="484" y="247" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Data lifetimes + AMEE</text>
<text x="484" y="272" fill="#a7bed1" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Retention + documentation</text>
<path d="M614 223 L665 223" fill="none" stroke="#7892aa" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="668" y="126" width="255" height="213" rx="16" fill="#10253a" stroke="#e8a6f3" stroke-width="2"/>
