<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="426" viewBox="0 0 1280 426" role="img" aria-label="XDF-1 engineering milestones and independently verified scope">
<title>XDF-1 engineering milestones and independently verified scope</title>
<rect width="1280" height="426" fill="#0a1425"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7892aa"/></marker></defs>
<text x="640" y="46" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700">ENGINEERING ROADMAP  |  OBSERVE REAL PROGRESS</text>
<text x="640" y="78" fill="#a7bed1" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400">Verified hardware is separate from reference software and planned physical capabilities.</text>
