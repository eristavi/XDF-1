<text x="1106" y="247" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">DMA + high-speed I/O</text>
<text x="1106" y="272" fill="#a7bed1" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">FPGA + measured watts</text>
<text x="640" y="386" fill="#a7bed1" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">No current evidence of physical 500 MB/s handling, neural acceleration, FPGA Fmax or sensor-to-action power.</text>
