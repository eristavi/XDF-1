<text x="173" y="247" fill="#edf5ff" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">64 streams + 4 lanes</text>
<text x="173" y="272" fill="#a7bed1" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400">XDF arithmetic bridge</text>
