[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xdf1-reference"
version = "0.1.0"
description = "XDF-1 experimental dataflow processor architecture and reference model"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
xdf1 = "xdf1.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
